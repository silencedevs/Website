name: Refresh Roblox metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run refresh:games
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-metadata-review-before-committing
          path: |
            data/roblox-cache.json
            public/assets/games/
